name: Club Feast
description: >-
  Club Feast is a technology-enabled restaurant delivery and corporate catering
  company founded in 2020 by Atallah Atallah, Ghazi Atallah, and Chris Miao. It
  began as a subscription-based consumer meal service delivering signature dishes
  from neighborhood restaurants at deep discounts through a pre-order, scheduled
  batch-delivery model, and has since focused on corporate catering, group meal
  ordering with individual customization, event catering, and managed office
  pantry services for teams. Club Feast handles restaurant partnerships, menu
  curation, driver logistics, and delivery while employees select meals through
  its web app. The company raised seed funding led by General Catalyst and
  operates primarily in the San Francisco Bay Area. Club Feast does not currently
  publish a public developer API, portal, or specification; this profile tracks
  its company identity and public web surface within the API Evangelist network.
